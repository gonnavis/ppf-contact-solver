<svg xmlns="http://www.w3.org/2000/svg" aria-label="Absolute vs ratio contact gap illustration" role="img" viewBox="0 0 820 480"><title>Absolute vs ratio contact gap</title><desc>Two side-by-side columns, each showing a small and a large object with their contact-gap halo drawn as a dashed red ring. In the Absolute column, both halos are the same thickness (~20 px) so the small object&apos;s halo looks huge relative to it and the large object&apos;s halo looks small. In the Ratio column, each halo is 50% of the object&apos;s radius, so both objects look proportionally wrapped, and the visual feel of the contact layer stays consistent regardless of scale.</desc><style>.title{font:700 20px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1a1a1a}.subtitle{font:italic 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#555}.label{font:600 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1a1a1a}.obj{fill:#2e6da4}.bracket,.gap{stroke:#c93b3b;fill:none}.gap{stroke-width:2;stroke-dasharray:6 4}.bracket{stroke-width:1.5}.bracket-tx{font:600 11px -apple-system,sans-serif;fill:#c93b3b}.divider{stroke:#bbb;stroke-width:1;stroke-dasharray:3 3}.hdr-bg-abs{fill:#fdf2f2}.hdr-bg-rat{fill:#eef6fb}</style><rect width="410" height="68" x="0" y="0" class="hdr-bg-abs"/><rect width="410" height="68" x="410" y="0" class="hdr-bg-rat"/><text x="205" y="30" class="title" text-anchor="middle">Absolute</text><text x="205" y="54" class="subtitle" text-anchor="middle">contact_gap = fixed distance</text><circle cx="135" cy="160" r="50" class="gap"/><circle cx="135" cy="160" r="30" class="obj"/><text x="135" y="235" class="label" text-anchor="middle">small</text><circle cx="275" cy="370" r="100" class="gap"/><circle cx="275" cy="370" r="80" class="obj"/><text x="275" y="480" class="label" text-anchor="middle" style="font-size:13px">large</text><path d="M 70 165 L 50 165 L 50 185 L 70 185" class="bracket"/><text x="28" y="180" class="bracket-tx" text-anchor="middle"><tspan x="30" dy="0">same</tspan> <tspan x="30" dy="14">20 px</tspan></text><path d="M 160 370 L 140 370 L 140 390 L 160 390" class="bracket"/><text x="118" y="385" class="bracket-tx" text-anchor="middle"><tspan x="120" dy="0">same</tspan> <tspan x="120" dy="14">20 px</tspan></text><line x1="410" x2="410" y1="80" y2="465" class="divider"/><text x="615" y="30" class="title" text-anchor="middle">Ratio</text><text x="615" y="54" class="subtitle" text-anchor="middle">contact_gap_rat = fraction of bbox</text><circle cx="545" cy="160" r="45" class="gap"/><circle cx="545" cy="160" r="30" class="obj"/><text x="545" y="235" class="label" text-anchor="middle">small</text><circle cx="685" cy="370" r="120" class="gap"/><circle cx="685" cy="370" r="80" class="obj"/><text x="685" y="480" class="label" text-anchor="middle" style="font-size:13px">large</text><path d="M 493 165 L 473 165 L 473 185 L 493 185" class="bracket"/><text x="450" y="180" class="bracket-tx" text-anchor="middle"><tspan x="452" dy="0">15 px</tspan> <tspan x="452" dy="14">(50%)</tspan></text><path d="M 548 370 L 528 370 L 528 390 L 548 390" class="bracket"/><text x="500" y="385" class="bracket-tx" text-anchor="middle"><tspan x="505" dy="0">40 px</tspan> <tspan x="505" dy="14">(50%)</tspan></text></svg>