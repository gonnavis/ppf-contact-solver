<svg xmlns="http://www.w3.org/2000/svg" aria-label="Blender Z-up vs solver Y-up coordinate conversion" role="img" viewBox="0 0 820 420"><title>Z-up (Blender) vs Y-up (solver) coordinate conversion</title><desc>Two right-handed coordinate triads placed side by side. On the left, the Blender frame has X pointing right, Y pointing diagonally into the page, and Z pointing straight up. On the right, the solver frame has X pointing right, Y pointing straight up, and Z pointing diagonally toward the viewer (out of the page). An arrow between them is labeled with the conversion rule: a Blender vector (x, y, z) is sent to the solver as [x, z, -y], and solver results are converted back the same way on fetch.</desc><defs><marker id="arrow-x" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#c93b3b" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-y" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#3a8a3a" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-z" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2e6da4" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-map" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#555" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><style>.title{font:700 20px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1a1a1a}.subtitle{font:italic 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#555}.axisx{stroke:#c93b3b}.axisx,.axisy,.axisz{stroke-width:3;fill:none}.axisy{stroke:#3a8a3a}.axisz{stroke:#2e6da4}.lbl-x{fill:#c93b3b}.lbl-x,.lbl-y,.lbl-z{font:700 16px -apple-system,sans-serif}.lbl-y{fill:#3a8a3a}.lbl-z{fill:#2e6da4}.note{font:12px -apple-system,sans-serif;fill:#666}.origin{fill:#333}.hdr-bg-b{fill:#f2f4f8}.hdr-bg-s{fill:#eef6eb}.divider{stroke:#bbb;stroke-width:1;stroke-dasharray:3 3}.map{stroke:#555;stroke-width:2;fill:none}.map-tx{font:600 14px -apple-system,&quot;Menlo&quot;,monospace;fill:#1a1a1a}.map-nt{font:italic 12px -apple-system,sans-serif;fill:#666}</style><rect width="360" height="60" x="0" y="0" class="hdr-bg-b"/><rect width="360" height="60" x="460" y="0" class="hdr-bg-s"/><text x="180" y="28" class="title" text-anchor="middle">Blender</text><text x="180" y="48" class="subtitle" text-anchor="middle">Z-up, right-handed</text><text x="640" y="28" class="title" text-anchor="middle">Solver</text><text x="640" y="48" class="subtitle" text-anchor="middle">Y-up, right-handed</text><line x1="180" x2="320" y1="260" y2="260" marker-end="url(#arrow-x)" class="axisx"/><text x="330" y="265" class="lbl-x">X</text><line x1="180" x2="80" y1="260" y2="202" marker-end="url(#arrow-y)" class="axisy"/><text x="58" y="195" class="lbl-y">Y</text><line x1="180" x2="180" y1="260" y2="120" marker-end="url(#arrow-z)" class="axisz"/><text x="188" y="118" class="lbl-z">Z (up)</text><circle cx="180" cy="260" r="3.5" class="origin"/><text x="180" y="330" class="note" text-anchor="middle">X right · Y into scene · Z up</text><line x1="410" x2="410" y1="80" y2="360" class="divider"/><line x1="370" x2="450" y1="210" y2="210" marker-end="url(#arrow-map)" class="map"/><text x="410" y="192" class="map-tx" text-anchor="middle">(x, y, z)</text><text x="410" y="235" class="map-tx" text-anchor="middle">[x, z, -y]</text><text x="410" y="255" class="map-nt" text-anchor="middle">sent to solver</text><line x1="450" x2="370" y1="320" y2="320" marker-end="url(#arrow-map)" class="map"/><text x="410" y="305" class="map-tx" text-anchor="middle">[X, Y, Z]</text><text x="410" y="345" class="map-tx" text-anchor="middle">(X, -Z, Y)</text><text x="410" y="365" class="map-nt" text-anchor="middle">back on fetch</text><line x1="640" x2="780" y1="260" y2="260" marker-end="url(#arrow-x)" class="axisx"/><text x="790" y="265" class="lbl-x">X</text><line x1="640" x2="640" y1="260" y2="120" marker-end="url(#arrow-y)" class="axisy"/><text x="648" y="118" class="lbl-y">Y (up)</text><line x1="640" x2="540" y1="260" y2="318" marker-end="url(#arrow-z)" class="axisz"/><text x="518" y="330" class="lbl-z">Z</text><circle cx="640" cy="260" r="3.5" class="origin"/><text x="640" y="378" class="note" text-anchor="middle">X right · Y up · Z toward viewer</text></svg>