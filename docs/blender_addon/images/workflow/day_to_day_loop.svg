<svg xmlns="http://www.w3.org/2000/svg" aria-label="The add-on's day-to-day workflow as nine numbered steps across three phases: scene setup in Blender, solve on the GPU, and handoff to standalone Blender animation" role="img" viewBox="0 0 1020 380"><title>Day-to-day workflow. Nine steps across three phases</title><desc>Nine numbered step boxes arranged as a two-row pipeline. Row one covers steps 1 through 5: organize objects into groups (Solid, Shell, Rod, PDRD, Sand, Static); assign material parameters per group (density, Young&apos;s modulus, Poisson ratio, bend, shrink, strain limit); set scene parameters (gravity, wind, time step, frame count, air density and friction); add pins and attach operations (Move By, Spin, Scale, Torque); and optionally add invisible colliders (infinite walls, spheres, bowls). Row two covers steps 6 through 9: optionally snap and merge overlapping meshes across group boundaries; then Transfer and Build (send geometry and parameters to the solver); then Run and Fetch (solve on the GPU and download frames as animation on the Blender meshes); and optionally Bake the fetched cache into standard Blender shape keys and keyframes, dropping the ContactSolverCache modifier. Boxes for scene-setup steps are blue, solve steps are orange, and the handoff bake step is green. Optional steps have dashed borders. A single forward arrow links the steps in sequence.</desc><defs><marker id="wf-arrow" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2e6da4" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="wf-arrow-iter" markerHeight="11" markerWidth="11" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6a3ea1" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><style>.title{font:700 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1a1a1a}.sub{font:13px -apple-system,sans-serif;fill:#555}.band-lbl{font:italic 11.5px -apple-system,sans-serif;fill:#777}.box-scene,.box-scene-o{fill:#f5f8fc;stroke:#8fa7c7;stroke-width:1.3}.box-scene-o{stroke-dasharray:5 3}.box-hand,.box-solve{stroke-width:1.3}.box-solve{fill:#fff8ec;stroke:#d7a95a}.box-hand{fill:#f2faf0;stroke:#86b36a;stroke-dasharray:5 3}.num-scene{fill:#8fa7c7}.num-solve{fill:#d7a95a}.num-hand{fill:#86b36a}.num-tx{font:700 12px -apple-system,sans-serif;fill:#fff}.box-ttl{font:700 13px -apple-system,sans-serif;fill:#1a1a1a}.box-sub{font:10.5px -apple-system,sans-serif;fill:#444}.box-mono{font:600 10px &quot;Menlo&quot;,&quot;Consolas&quot;,monospace;fill:#444}.opt-tag{font:italic 10px -apple-system,sans-serif;fill:#888}.arr{stroke:#2e6da4;stroke-width:2;fill:none}</style><text x="20" y="30" class="title">The day-to-day loop</text><text x="20" y="50" class="sub">Steps 1–6 are done in Blender, 7–8 run on the solver, 9 hands off to standalone Blender animation. Dashed boxes are optional.</text><text x="25" y="82" class="band-lbl">Scene setup (in Blender)</text><rect width="180" height="114" x="25" y="96" class="box-scene" rx="8"/><circle cx="45" cy="116" r="11" class="num-scene"/><text x="45" y="120" class="num-tx" text-anchor="middle">1</text><text x="63" y="120" class="box-ttl">Object groups</text><text x="35" y="146" class="box-sub">Group your meshes by role.</text><text x="35" y="162" class="box-mono">Solid / Shell / Rod / PDRD</text><text x="35" y="176" class="box-mono">Sand / Static (collision)</text><text x="35" y="196" class="opt-tag">up to 32 active groups</text><rect width="180" height="114" x="225" y="96" class="box-scene" rx="8"/><circle cx="245" cy="116" r="11" class="num-scene"/><text x="245" y="120" class="num-tx" text-anchor="middle">2</text><text x="263" y="120" class="box-ttl">Material parameters</text><text x="235" y="146" class="box-sub">Per-group physics.</text><text x="235" y="162" class="box-mono">density · Young&apos;s · Poisson</text><text x="235" y="176" class="box-mono">bend · shrink · strain limit</text><text x="235" y="196" class="opt-tag">contact gap / friction too</text><rect width="180" height="114" x="425" y="96" class="box-scene" rx="8"/><circle cx="445" cy="116" r="11" class="num-scene"/><text x="445" y="120" class="num-tx" text-anchor="middle">3</text><text x="463" y="120" class="box-ttl">Scene parameters</text><text x="435" y="146" class="box-sub">Global solver settings.</text><text x="435" y="162" class="box-mono">gravity · wind · time step</text><text x="435" y="176" class="box-mono">frame count · air density</text><text x="435" y="196" class="opt-tag">keyframeable via dynamic params</text><rect width="180" height="114" x="625" y="96" class="box-scene" rx="8"/><circle cx="645" cy="116" r="11" class="num-scene"/><text x="645" y="120" class="num-tx" text-anchor="middle">4</text><text x="663" y="120" class="box-ttl">Pins + operations</text><text x="635" y="146" class="box-sub">Anchor vertices &amp; drive them.</text><text x="635" y="162" class="box-mono">Move By · Spin · Scale</text><text x="635" y="176" class="box-mono">Torque</text><text x="635" y="196" class="opt-tag">keyframed or time-ranged</text><rect width="180" height="114" x="825" y="96" class="box-scene-o" rx="8"/><circle cx="845" cy="116" r="11" class="num-scene"/><text x="845" y="120" class="num-tx" text-anchor="middle">5</text><text x="863" y="120" class="box-ttl">Colliders</text><text x="998" y="120" class="opt-tag" text-anchor="end">optional</text><text x="835" y="146" class="box-sub">Parametric boundaries.</text><text x="835" y="162" class="box-mono">walls · spheres · bowls</text><text x="835" y="176" class="box-mono">hemispheres · inverted</text><text x="835" y="196" class="opt-tag">no mesh in the scene</text><line x1="205" x2="225" y1="153" y2="153" marker-end="url(#wf-arrow)" class="arr"/><line x1="405" x2="425" y1="153" y2="153" marker-end="url(#wf-arrow)" class="arr"/><line x1="605" x2="625" y1="153" y2="153" marker-end="url(#wf-arrow)" class="arr"/><line x1="805" x2="825" y1="153" y2="153" marker-end="url(#wf-arrow)" class="arr"/><path marker-end="url(#wf-arrow)" d="M 915 210 L 915 230 L 115 230 L 115 250" class="arr"/><rect width="180" height="114" x="25" y="250" class="box-scene-o" rx="8"/><circle cx="45" cy="270" r="11" class="num-scene"/><text x="45" y="274" class="num-tx" text-anchor="middle">6</text><text x="63" y="274" class="box-ttl">Snap &amp; Merge</text><text x="198" y="274" class="opt-tag" text-anchor="end">optional</text><text x="35" y="300" class="box-sub">Stitch across group boundaries.</text><text x="35" y="316" class="box-mono">snap source → target surface</text><text x="35" y="330" class="box-mono">merge with stitch stiffness</text><text x="35" y="350" class="opt-tag">per-vertex barycentric anchors</text><rect width="180" height="114" x="225" y="250" class="box-solve" rx="8"/><circle cx="245" cy="270" r="11" class="num-solve"/><text x="245" y="274" class="num-tx" text-anchor="middle">7</text><text x="263" y="274" class="box-ttl">Transfer + Build</text><text x="235" y="300" class="box-sub">Send the scene to the solver.</text><text x="235" y="316" class="box-mono">mesh + params → solver</text><text x="235" y="330" class="box-mono">set up the run</text><text x="235" y="350" class="opt-tag">&quot;Update Params&quot; for param-only edits</text><rect width="180" height="114" x="425" y="250" class="box-solve" rx="8"/><circle cx="445" cy="270" r="11" class="num-solve"/><text x="445" y="274" class="num-tx" text-anchor="middle">8</text><text x="463" y="274" class="box-ttl">Run + Fetch</text><text x="435" y="300" class="box-sub">Solve on GPU, pull frames back.</text><text x="435" y="316" class="box-mono">per-frame mesh data</text><text x="435" y="330" class="box-mono">ContactSolverCache modifier</text><text x="435" y="350" class="opt-tag">survives Blender quit / reconnect</text><rect width="180" height="114" x="625" y="250" class="box-hand" rx="8"/><circle cx="645" cy="270" r="11" class="num-hand"/><text x="645" y="274" class="num-tx" text-anchor="middle">9</text><text x="663" y="274" class="box-ttl">Bake</text><text x="798" y="274" class="opt-tag" text-anchor="end">optional</text><text x="635" y="300" class="box-sub">Freeze into plain Blender anim.</text><text x="635" y="316" class="box-mono">meshes: shape keys</text><text x="635" y="330" class="box-mono">curves: keyframes</text><text x="635" y="350" class="opt-tag">cache modifier and file removed</text><line x1="205" x2="225" y1="307" y2="307" marker-end="url(#wf-arrow)" class="arr"/><line x1="405" x2="425" y1="307" y2="307" marker-end="url(#wf-arrow)" class="arr"/><line x1="605" x2="625" y1="307" y2="307" marker-end="url(#wf-arrow)" class="arr"/></svg>