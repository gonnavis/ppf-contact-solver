<svg xmlns="http://www.w3.org/2000/svg" aria-label="JupyterLab end-to-end loop: Blender transfers and exports, Blender quits, JupyterLab runs the simulation, Blender relaunches and fetches" role="img" viewBox="0 0 860 620"><title>JupyterLab end-to-end loop</title><desc>A three-lane sequence diagram. The left lane is the first Blender session. The middle lane is JupyterLab running on the solver host. The right lane is a later Blender session. Time flows top to bottom. The first Blender session transfers mesh and parameters, exports the notebook, and optionally starts the solver server. Blender then quits. JupyterLab drives the simulation through app.session.run, preview, and stream, and frames land on disk on the solver host. A later Blender session launches, connects, and fetches the animation; the solver host hands the animation cache back to the meshes.</desc><defs><marker id="arrow-solid" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-blue" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2e6da4" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#3a8a3a" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><style>.hdr-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1a1a1a}.hdr-sub{font:italic 12px -apple-system,sans-serif;fill:#555}.hdr-bg-b1{fill:#e9eef7;stroke:#8fa7c7}.hdr-bg-b1,.hdr-bg-b2,.hdr-bg-jup{stroke-width:1}.hdr-bg-jup{fill:#fff3e0;stroke:#d7a95a}.hdr-bg-b2{fill:#e9eef7;stroke:#8fa7c7}.lifeline{stroke:#aaa;stroke-width:1.2;stroke-dasharray:4 4}.arr-b,.arr-g{stroke:#2e6da4;stroke-width:2;fill:none}.arr-g{stroke:#3a8a3a}.lbl{font:600 13px -apple-system,sans-serif;fill:#1a1a1a}.lbl-mono{font:600 12px &quot;Menlo&quot;,&quot;Consolas&quot;,monospace;fill:#1a1a1a}.note{font:12px -apple-system,sans-serif;fill:#555}.marker-bg{fill:#fff3e0;stroke:#d7a95a;stroke-width:1.2}.marker-tx{font:700 12px -apple-system,sans-serif;fill:#7a4a00}.self-bg{fill:#f2f7ef;stroke:#86b36a;stroke-width:1}.self-tx{font:600 12px &quot;Menlo&quot;,&quot;Consolas&quot;,monospace;fill:#1a4a1a}.phase-tx{font:italic 12px -apple-system,sans-serif;fill:#888}</style><rect width="200" height="54" x="30" y="20" class="hdr-bg-b1" rx="6"/><text x="130" y="43" class="hdr-title" text-anchor="middle">Blender (1)</text><text x="130" y="62" class="hdr-sub" text-anchor="middle">initial session</text><rect width="260" height="54" x="300" y="20" class="hdr-bg-jup" rx="6"/><text x="430" y="43" class="hdr-title" text-anchor="middle">JupyterLab</text><text x="430" y="62" class="hdr-sub" text-anchor="middle">on solver host</text><rect width="200" height="54" x="630" y="20" class="hdr-bg-b2" rx="6"/><text x="730" y="43" class="hdr-title" text-anchor="middle">Blender (2)</text><text x="730" y="62" class="hdr-sub" text-anchor="middle">later session</text><line x1="130" x2="130" y1="74" y2="580" class="lifeline"/><line x1="430" x2="430" y1="74" y2="580" class="lifeline"/><line x1="730" x2="730" y1="74" y2="580" class="lifeline"/><text x="20" y="100" class="phase-tx">Setup</text><line x1="140" x2="420" y1="115" y2="115" marker-end="url(#arrow-blue)" class="arr-b"/><text x="280" y="108" class="lbl" text-anchor="middle">Transfer</text><text x="280" y="131" class="note" text-anchor="middle">mesh + params stored</text><line x1="140" x2="420" y1="160" y2="160" marker-end="url(#arrow-blue)" class="arr-b"/><text x="280" y="153" class="lbl" text-anchor="middle">Export notebook</text><text x="280" y="176" class="lbl-mono" text-anchor="middle">&lt;project&gt;.ipynb</text><line x1="140" x2="420" y1="205" y2="205" marker-end="url(#arrow-blue)" class="arr-b"/><text x="280" y="198" class="lbl" text-anchor="middle">Start Server</text><text x="280" y="221" class="note" text-anchor="middle">(optional)</text><rect width="120" height="26" x="70" y="245" class="marker-bg" rx="13"/><text x="130" y="263" class="marker-tx" text-anchor="middle">QUIT BLENDER</text><text x="20" y="300" class="phase-tx">Simulate</text><rect width="200" height="80" x="330" y="290" class="self-bg" rx="6"/><text x="430" y="310" class="self-tx" text-anchor="middle">app.session.run()</text><text x="430" y="330" class="self-tx" text-anchor="middle">app.session.preview()</text><text x="430" y="350" class="self-tx" text-anchor="middle">app.session.stream()</text><text x="430" y="366" class="note" text-anchor="middle">Blender closed; solver host drives the sim</text><path fill="none" marker-end="url(#arrow-green)" d="M 480 400 C 560 400 560 430 480 430" class="arr-g"/><text x="568" y="419" class="note">frames land on disk</text><rect width="120" height="26" x="670" y="455" class="marker-bg" rx="13"/><text x="730" y="473" class="marker-tx" text-anchor="middle">LAUNCH BLENDER</text><text x="20" y="508" class="phase-tx">Fetch</text><line x1="720" x2="440" y1="510" y2="510" marker-end="url(#arrow-blue)" class="arr-b"/><text x="580" y="503" class="lbl" text-anchor="middle">Connect + Fetch</text><text x="580" y="526" class="lbl-mono" text-anchor="middle">fetch_animation()</text><line x1="440" x2="720" y1="560" y2="560" marker-end="url(#arrow-green)" class="arr-g"/><text x="580" y="553" class="lbl" text-anchor="middle">animation cache</text><text x="580" y="576" class="note" text-anchor="middle">attached to the meshes</text></svg>