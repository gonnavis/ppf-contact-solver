<svg xmlns="http://www.w3.org/2000/svg" aria-label="How the JupyterLab pieces fit together: Blender plus add-on talks to the solver host to transfer the scene and export the notebook, then opens the browser which attaches back to the solver host via BlenderApp.open" role="img" viewBox="0 0 860 340"><title>JupyterLab transport diagram</title><desc>Three lanes. On the left, Blender plus the add-on. In the middle, the solver host that owns the pickled scene and the exported notebook. On the right, the browser. The add-on pushes the mesh and parameters and the notebook file through the solver connection, while the browser URL is opened separately. Once loaded, the browser attaches back to the solver host by calling BlenderApp.open inside the notebook.</desc><defs><marker id="h-arrow-b" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2e6da4" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="h-arrow-g" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#3a8a3a" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="h-arrow-k" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><style>.hdr-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1a1a1a}.hdr-sub{font:italic 12px -apple-system,sans-serif;fill:#555}.hdr-addon{fill:#e9eef7;stroke:#8fa7c7}.hdr-addon,.hdr-browser,.hdr-host{stroke-width:1}.hdr-host{fill:#fff3e0;stroke:#d7a95a}.hdr-browser{fill:#eef6eb;stroke:#86b36a}.lifeline{stroke:#aaa;stroke-width:1.2;stroke-dasharray:4 4}.arr-b{stroke:#2e6da4}.arr-b,.arr-g,.arr-k{stroke-width:2;fill:none}.arr-g{stroke:#3a8a3a}.arr-k{stroke:#1a1a1a}.lbl{font:600 13px -apple-system,sans-serif;fill:#1a1a1a}.lbl-mono{font:600 12px &quot;Menlo&quot;,&quot;Consolas&quot;,monospace;fill:#1a1a1a}.note{font:12px -apple-system,sans-serif;fill:#555}</style><rect width="220" height="54" x="30" y="20" class="hdr-addon" rx="6"/><text x="140" y="43" class="hdr-title" text-anchor="middle">Blender + add-on</text><text x="140" y="62" class="hdr-sub" text-anchor="middle">local workstation</text><rect width="220" height="54" x="320" y="20" class="hdr-host" rx="6"/><text x="430" y="43" class="hdr-title" text-anchor="middle">solver host</text><text x="430" y="62" class="hdr-sub" text-anchor="middle">pickles + notebook</text><rect width="220" height="54" x="610" y="20" class="hdr-browser" rx="6"/><text x="720" y="43" class="hdr-title" text-anchor="middle">browser</text><text x="720" y="62" class="hdr-sub" text-anchor="middle">JupyterLab UI</text><line x1="140" x2="140" y1="74" y2="310" class="lifeline"/><line x1="430" x2="430" y1="74" y2="310" class="lifeline"/><line x1="720" x2="720" y1="74" y2="310" class="lifeline"/><line x1="150" x2="420" y1="115" y2="115" marker-end="url(#h-arrow-b)" class="arr-b"/><text x="285" y="108" class="lbl" text-anchor="middle">transfer</text><text x="285" y="131" class="note" text-anchor="middle">mesh + params</text><line x1="150" x2="420" y1="165" y2="165" marker-end="url(#h-arrow-b)" class="arr-b"/><text x="285" y="158" class="lbl" text-anchor="middle">Export notebook</text><text x="285" y="181" class="lbl-mono" text-anchor="middle">&lt;project&gt;.ipynb</text><line x1="150" x2="710" y1="220" y2="220" marker-end="url(#h-arrow-k)" class="arr-k"/><text x="430" y="213" class="lbl" text-anchor="middle">Open</text><text x="430" y="236" class="lbl-mono" text-anchor="middle">http://host:8080/lab/tree/…</text><line x1="710" x2="440" y1="280" y2="280" marker-end="url(#h-arrow-g)" class="arr-g"/><text x="575" y="273" class="lbl-mono" text-anchor="middle">BlenderApp.open(project)</text><text x="575" y="296" class="note" text-anchor="middle">notebook attaches to the pickles</text></svg>