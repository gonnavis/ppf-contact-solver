<svg xmlns="http://www.w3.org/2000/svg" aria-label="Three entry points (MCP Streamable HTTP, Blender UI operators, and the Python module) funnel into the same shared add-on core, through one of five transports, to ppf-cts-server" role="img" viewBox="0 0 960 640"><title>Three entry points converge on the same add-on surface</title><desc>A layered block diagram. The top row shows three client categories: AI agents and automation talking to the add-on remotely (in terms of process), a human operator driving the Blender sidebar directly, and a Python user scripting the add-on from Blender&apos;s text editor or a notebook. Each client lands in a protocol box in the second row: an MCP Streamable HTTP server on localhost port 9633; Blender operators keyed by bl_idname; and the add-on&apos;s Python API (exposed under bl_ext.user_default.ppf_contact_solver.ops.api), which forwards unknown attributes to the matching operator. All three protocol boxes funnel into a single shared add-on core row labeled scene.zozo_contact_solver, the place where pins, merges, colliders, and every scene mutation run through the same validation. A single transport row below that stands in for the five connection types. At the bottom, ppf-cts-server runs on whichever side of the transport boundary the mode places it. An orange pill on the MCP box notes that the HTTP server binds localhost only.</desc><defs><marker id="e-arrow" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2e6da4" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="e-arrow-g" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#5a7a3a" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><style>.title{font:700 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1a1a1a}.sub{font:13px -apple-system,sans-serif;fill:#555}.row-lbl{font:italic 12px -apple-system,sans-serif;fill:#777}.box-client,.box-proto{fill:#f3f5fa;stroke:#8fa7c7;stroke-width:1.2}.box-proto{fill:#fff3e0;stroke:#d7a95a}.box-core{fill:#f2ecf7;stroke:#9a80c0;stroke-width:1.3}.box-trans{fill:#f5f5f5;stroke:#999;stroke-width:1.2;stroke-dasharray:6 4}.box-server{fill:#eef6eb;stroke:#86b36a;stroke-width:1.3}.hdr-title{font:700 14px -apple-system,sans-serif;fill:#1a1a1a}.hdr-sub{font:11.5px -apple-system,sans-serif;fill:#444}.hdr-mono{font:600 11px &quot;Menlo&quot;,&quot;Consolas&quot;,monospace;fill:#1a1a1a}.hdr-italic{font:italic 11px -apple-system,sans-serif;fill:#555}.arr,.arr-g{stroke:#2e6da4;stroke-width:2;fill:none}.arr-g{stroke:#5a7a3a;stroke-dasharray:5 4}.lbl-mono{font:600 11px &quot;Menlo&quot;,&quot;Consolas&quot;,monospace;fill:#1a1a1a}.pill-warn{fill:#fde2d0;stroke:#d77a3a;stroke-width:1}.pill-tx{font:700 10.5px -apple-system,sans-serif;fill:#7a3a00}</style><text x="20" y="30" class="title">The add-on&apos;s three entry points</text><text x="20" y="50" class="sub">MCP, the Blender UI, and the Python module all land on the same validation layer, and then on the same transport.</text><text x="20" y="88" class="row-lbl">who is driving the add-on</text><rect width="280" height="72" x="30" y="98" class="box-client" rx="8"/><text x="170" y="122" class="hdr-title" text-anchor="middle">AI agents &amp; automation</text><text x="170" y="140" class="hdr-sub" text-anchor="middle">Claude Desktop, IDE plugins,</text><text x="170" y="156" class="hdr-sub" text-anchor="middle">CI runners, shell scripts</text><rect width="280" height="72" x="340" y="98" class="box-client" rx="8"/><text x="480" y="122" class="hdr-title" text-anchor="middle">Human operator</text><text x="480" y="140" class="hdr-sub" text-anchor="middle">Blender 3D viewport sidebar</text><text x="480" y="156" class="hdr-sub" text-anchor="middle">(N-panel, buttons, fields)</text><rect width="280" height="72" x="650" y="98" class="box-client" rx="8"/><text x="790" y="122" class="hdr-title" text-anchor="middle">Python user</text><text x="790" y="140" class="hdr-sub" text-anchor="middle">Blender text editor,</text><text x="790" y="156" class="hdr-sub" text-anchor="middle">JupyterLab notebooks, add-on code</text><line x1="170" x2="170" y1="170" y2="210" marker-end="url(#e-arrow)" class="arr"/><line x1="480" x2="480" y1="170" y2="210" marker-end="url(#e-arrow)" class="arr"/><line x1="790" x2="790" y1="170" y2="210" marker-end="url(#e-arrow)" class="arr"/><text x="20" y="230" class="row-lbl">how that drive lands in the add-on</text><rect width="280" height="100" x="30" y="240" class="box-proto" rx="8"/><text x="170" y="264" class="hdr-title" text-anchor="middle">MCP Streamable HTTP</text><text x="170" y="282" class="hdr-mono" text-anchor="middle">POST/GET/DELETE /mcp</text><text x="170" y="300" class="hdr-mono" text-anchor="middle">:9633 (fallback +1…+9)</text><rect width="190" height="20" x="75" y="310" class="pill-warn" rx="10"/><text x="170" y="324" class="pill-tx" text-anchor="middle">localhost only (do not expose)</text><rect width="280" height="100" x="340" y="240" class="box-proto" rx="8"/><text x="480" y="264" class="hdr-title" text-anchor="middle">Blender operators</text><text x="480" y="284" class="hdr-mono" text-anchor="middle">bl_idname = &quot;solver.*&quot;</text><text x="480" y="300" class="hdr-mono" text-anchor="middle">bl_idname = &quot;object.*&quot;</text><text x="480" y="320" class="hdr-italic" text-anchor="middle">used by every button in the panel</text><rect width="280" height="100" x="650" y="240" class="box-proto" rx="8"/><text x="790" y="264" class="hdr-title" text-anchor="middle">Python API (addon)</text><text x="790" y="284" class="hdr-mono" text-anchor="middle">solver.create_group(...)</text><text x="790" y="300" class="hdr-mono" text-anchor="middle">solver.transfer_data(), ...</text><text x="790" y="320" class="hdr-italic" text-anchor="middle">forwards unknown attrs to operators</text><path marker-end="url(#e-arrow)" d="M 170 340 L 170 380 L 480 380" class="arr"/><line x1="480" x2="480" y1="340" y2="380" marker-end="url(#e-arrow)" class="arr"/><path d="M 790 340 L 790 380 L 480 380" class="arr"/><text x="20" y="400" class="row-lbl">where every path meets (same validation, same scene state)</text><rect width="900" height="80" x="30" y="410" class="box-core" rx="10"/><text x="480" y="434" class="hdr-title" text-anchor="middle">Add-on core</text><text x="480" y="454" class="hdr-mono" text-anchor="middle">scene.zozo_contact_solver :: state, object_group_0…31, merge_pairs, invisible_colliders</text><text x="480" y="474" class="hdr-italic" text-anchor="middle">pins, merges, colliders, transfer, run, fetch: all three paths share this validation layer</text><line x1="480" x2="480" y1="490" y2="528" marker-end="url(#e-arrow-g)" class="arr-g"/><text x="490" y="512" class="lbl-mono">TCP to ppf-cts-server</text><text x="20" y="548" class="row-lbl">across one of the six transports</text><rect width="900" height="46" x="30" y="558" class="box-trans" rx="8"/><text x="480" y="578" class="hdr-title" text-anchor="middle">Transport</text><text x="480" y="594" class="hdr-mono" text-anchor="middle">SSH (+ Command) / Docker / Docker over SSH (+ Command) / Windows, macOS, Linux Native</text><line x1="480" x2="480" y1="604" y2="614" marker-end="url(#e-arrow-g)" class="arr-g"/><rect width="300" height="22" x="330" y="614" class="box-server" rx="6"/><text x="480" y="630" class="hdr-mono" text-anchor="middle">ppf-cts-server :PORT</text></svg>