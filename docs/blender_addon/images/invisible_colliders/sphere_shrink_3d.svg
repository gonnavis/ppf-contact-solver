<svg xmlns="http://www.w3.org/2000/svg" aria-label="Five 3D sphere snapshots showing the shrink example at frames 1, 30, 60, 90, and 120: the first three spheres are identical in size at radius 1.0 (the Hold plateau), then the sphere shrinks to 0.75 at frame 90 and 0.5 at frame 120" role="img" viewBox="0 0 900 320"><title>Sphere shrink example: 3D snapshots along the timeline</title><desc>A horizontal strip of five shaded 3D spheres resting on a common ground line, left to right. The first three spheres, at frames 1, 30, and 60, are all the same size (radius 1.0): these three frames form the Hold plateau during which the sphere does not change. The fourth sphere at frame 90 is smaller (radius 0.75) because the radius is halfway along the linear ramp from 1.0 down to 0.5. The fifth sphere at frame 120 is smallest (radius 0.5), the end of the ramp. Each sphere casts an elliptical shadow on the ground and carries a small frame label and radius value underneath.</desc><defs><radialGradient id="sph-fill" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#e7edf7"/><stop offset="45%" stop-color="#6fa2d6"/><stop offset="100%" stop-color="#2e4a70"/></radialGradient><radialGradient id="sph-fill-hold" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#e7edf7"/><stop offset="45%" stop-color="#6fa2d6"/><stop offset="100%" stop-color="#2e4a70"/></radialGradient><radialGradient id="shadow-grad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#000" stop-opacity=".28"/><stop offset="70%" stop-color="#000" stop-opacity=".08"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient></defs><style>.title{font:700 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1a1a1a}.sub{font:13px -apple-system,sans-serif;fill:#555}.ground{stroke:#aab0b8;stroke-width:1.2;fill:none}.sphere{stroke:#1a3350;stroke-width:1}.frame-lbl{font:700 13px -apple-system,sans-serif;fill:#1a1a1a}.radius-lbl{font:600 11.5px &quot;Menlo&quot;,&quot;Consolas&quot;,monospace;fill:#444}.hold-band{fill:#fff6e0;stroke:#e6a820;stroke-width:1;stroke-dasharray:5 3}.hold-lbl,.ramp-lbl{font:700 12px -apple-system,sans-serif;fill:#7a5a00}.ramp-lbl{fill:#1f4a75}.note{font:11px -apple-system,sans-serif;fill:#555}</style><text x="20" y="30" class="title">Sphere snapshots along the timeline</text><text x="20" y="50" class="sub">Same three keyframes (1 Initial · 60 Hold · 120 Radius=0.5), drawn as the sphere would appear in the viewport at five moments.</text><rect width="430" height="200" x="40" y="75" class="hold-band" rx="10"/><text x="255" y="90" class="hold-lbl" text-anchor="middle">Hold plateau: frames 1 → 60 at radius 1.0</text><line x1="20" x2="880" y1="230" y2="230" class="ground"/><ellipse cx="100" cy="232" fill="url(#shadow-grad)" rx="56" ry="8"/><circle cx="100" cy="180" r="50" fill="url(#sph-fill-hold)" class="sphere"/><text x="100" y="258" class="frame-lbl" text-anchor="middle">Frame 1</text><text x="100" y="274" class="radius-lbl" text-anchor="middle">R = 1.0</text><text x="100" y="288" class="note" text-anchor="middle">(Initial)</text><ellipse cx="250" cy="232" fill="url(#shadow-grad)" rx="56" ry="8"/><circle cx="250" cy="180" r="50" fill="url(#sph-fill-hold)" class="sphere"/><text x="250" y="258" class="frame-lbl" text-anchor="middle">Frame 30</text><text x="250" y="274" class="radius-lbl" text-anchor="middle">R = 1.0</text><text x="250" y="288" class="note" text-anchor="middle">(mid-plateau)</text><ellipse cx="400" cy="232" fill="url(#shadow-grad)" rx="56" ry="8"/><circle cx="400" cy="180" r="50" fill="url(#sph-fill-hold)" class="sphere"/><text x="400" y="258" class="frame-lbl" text-anchor="middle">Frame 60</text><text x="400" y="274" class="radius-lbl" text-anchor="middle">R = 1.0</text><text x="400" y="288" class="note" text-anchor="middle">(Hold ✓, ramp starts)</text><text x="600" y="90" class="ramp-lbl" text-anchor="middle">Linear ramp: frames 60 → 120</text><text x="600" y="104" class="note" text-anchor="middle">radius 1.0 → 0.5</text><ellipse cx="600" cy="232" fill="url(#shadow-grad)" rx="42" ry="6"/><circle cx="600" cy="192.5" r="37.5" fill="url(#sph-fill)" class="sphere"/><text x="600" y="258" class="frame-lbl" text-anchor="middle">Frame 90</text><text x="600" y="274" class="radius-lbl" text-anchor="middle">R = 0.75</text><text x="600" y="288" class="note" text-anchor="middle">(mid-ramp)</text><ellipse cx="800" cy="232" fill="url(#shadow-grad)" rx="28" ry="4"/><circle cx="800" cy="205" r="25" fill="url(#sph-fill)" class="sphere"/><text x="800" y="258" class="frame-lbl" text-anchor="middle">Frame 120</text><text x="800" y="274" class="radius-lbl" text-anchor="middle">R = 0.5</text><text x="800" y="288" class="note" text-anchor="middle">(target)</text><circle cx="800" cy="180" r="50" fill="none" stroke="#c0c6cc" stroke-dasharray="3 3" stroke-width="1"/><text x="862" y="140" class="note">faint ring =</text><text x="862" y="154" class="note">original R=1.0</text></svg>