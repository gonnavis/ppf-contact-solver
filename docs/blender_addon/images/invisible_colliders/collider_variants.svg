<svg xmlns="http://www.w3.org/2000/svg" aria-label="The five invisible-collider shape variants (Wall, Sphere, Sphere+Invert, Sphere+Hemisphere, Sphere+Invert+Hemisphere), drawn side by side with their viewport arrow glyphs, so you can see which side of the shape dynamic geometry stays on" role="img" viewBox="0 0 1000 420"><title>Invisible collider shape variants</title><desc>Five side-by-side shape schematics matching the viewport overlay the add-on draws for each collider configuration. First panel: a Wall, drawn as a flat plane patch with faint dashed outlines indicating it extends to infinity, and a single blue arrow pointing along the Normal away from the plane. Second panel: a default Sphere, a circle with six outward-pointing arrows at the ±X, ±Y, ±Z cardinal points. Third panel: a Sphere with Invert checked, the same circle but with six inward-pointing arrows converging toward the center. Fourth panel: a Hemisphere without Invert, the lower half of a sphere plus a cylindrical extension rising from the equator to infinity, with outward arrows on both parts. Fifth panel: Hemisphere with Invert, the same bowl shape with arrows pointing inward; objects dropped from above land inside the bowl. A caption under each panel states &quot;dynamic geometry stays on the arrow side&quot;, and a row of short labels summarises each variant as outside, inside, capsule, or bowl.</desc><defs><marker id="cv-out" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2e6da4" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="cv-in" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#8a3a8a" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><style>.title{font:700 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1a1a1a}.sub{font:13px -apple-system,sans-serif;fill:#555}.panel-ttl{font:700 14px -apple-system,sans-serif;fill:#1a1a1a}.panel-opt{font:600 11px &quot;Menlo&quot;,&quot;Consolas&quot;,monospace;fill:#444}.panel-cap{font:12px -apple-system,sans-serif;fill:#1a1a1a}.panel-hi,.panel-hi2{font:700 12px -apple-system,sans-serif;fill:#1f4a75}.panel-hi2{fill:#6a2a6a}.frame{fill:none;stroke:#d0d0d0;stroke-width:1}.shape,.shape-f{fill:none;stroke:#6a7a8a;stroke-width:1.8}.shape-f{fill:#f3f6f9}.shape-dash{fill:none;stroke:#9eaab8;stroke-width:1.3;stroke-dasharray:4 3}.arr-in,.arr-out{stroke-width:2;fill:none}.arr-out{stroke:#2e6da4}.arr-in{stroke:#8a3a8a}.hatch{fill:#eceff3}.note{font:11px -apple-system,sans-serif;fill:#555}</style><text x="20" y="30" class="title">Invisible colliders: where the arrows point, and which side is &quot;free&quot;</text><text x="20" y="50" class="sub">In every variant, dynamic geometry stays on the arrow side. The opposite side is projected back across the surface.</text><rect width="190" height="300" x="10" y="72" class="frame" rx="8"/><text x="105" y="94" class="panel-ttl" text-anchor="middle">Wall</text><text x="105" y="110" class="panel-opt" text-anchor="middle">(no options)</text><polygon points="45 260 165 260 145 290 65 290" class="hatch"/><polygon points="45 260 165 260 145 290 65 290" class="shape"/><line x1="25" x2="45" y1="260" y2="260" class="shape-dash"/><line x1="165" x2="185" y1="260" y2="260" class="shape-dash"/><line x1="25" x2="45" y1="260" y2="290" class="shape-dash"/><line x1="185" x2="160" y1="260" y2="298" class="shape-dash"/><line x1="105" x2="105" y1="260" y2="175" marker-end="url(#cv-out)" class="arr-out"/><text x="115" y="210" class="panel-hi">Normal</text><text x="105" y="330" class="panel-cap" text-anchor="middle">Free side:</text><text x="105" y="348" class="panel-hi" text-anchor="middle">arrow side (+N)</text><text x="105" y="365" class="note" text-anchor="middle">opposite is projected back</text><rect width="190" height="300" x="208" y="72" class="frame" rx="8"/><text x="303" y="94" class="panel-ttl" text-anchor="middle">Sphere</text><text x="303" y="110" class="panel-opt" text-anchor="middle">(default)</text><circle cx="303" cy="220" r="50" class="shape"/><line x1="303" x2="303" y1="220" y2="160" marker-end="url(#cv-out)" class="arr-out"/><line x1="303" x2="303" y1="220" y2="280" marker-end="url(#cv-out)" class="arr-out"/><line x1="303" x2="243" y1="220" y2="220" marker-end="url(#cv-out)" class="arr-out"/><line x1="303" x2="363" y1="220" y2="220" marker-end="url(#cv-out)" class="arr-out"/><line x1="303" x2="261" y1="220" y2="262" marker-end="url(#cv-out)" class="arr-out"/><line x1="303" x2="345" y1="220" y2="178" marker-end="url(#cv-out)" class="arr-out"/><text x="303" y="330" class="panel-cap" text-anchor="middle">Free side:</text><text x="303" y="348" class="panel-hi" text-anchor="middle">outside</text><text x="303" y="365" class="note" text-anchor="middle">arrows point outward</text><rect width="190" height="300" x="406" y="72" class="frame" rx="8"/><text x="501" y="94" class="panel-ttl" text-anchor="middle">Sphere</text><text x="501" y="110" class="panel-opt" text-anchor="middle">Invert ✓</text><circle cx="501" cy="220" r="50" class="shape-f"/><line x1="501" x2="501" y1="150" y2="210" marker-end="url(#cv-in)" class="arr-in"/><line x1="501" x2="501" y1="290" y2="230" marker-end="url(#cv-in)" class="arr-in"/><line x1="431" x2="491" y1="220" y2="220" marker-end="url(#cv-in)" class="arr-in"/><line x1="571" x2="511" y1="220" y2="220" marker-end="url(#cv-in)" class="arr-in"/><line x1="451" x2="493" y1="170" y2="212" marker-end="url(#cv-in)" class="arr-in"/><line x1="551" x2="509" y1="270" y2="228" marker-end="url(#cv-in)" class="arr-in"/><text x="501" y="330" class="panel-cap" text-anchor="middle">Free side:</text><text x="501" y="348" class="panel-hi2" text-anchor="middle">inside (containment)</text><text x="501" y="365" class="note" text-anchor="middle">arrows point toward center</text><rect width="190" height="300" x="604" y="72" class="frame" rx="8"/><text x="699" y="94" class="panel-ttl" text-anchor="middle">Sphere</text><text x="699" y="110" class="panel-opt" text-anchor="middle">Hemisphere ✓</text><path fill="none" d="M 649 240 A 50 50 0 0 0 749 240" class="shape"/><line x1="649" x2="649" y1="240" y2="155" class="shape"/><line x1="749" x2="749" y1="240" y2="155" class="shape"/><line x1="649" x2="749" y1="155" y2="155" class="shape-dash"/><line x1="649" x2="649" y1="155" y2="138" class="shape-dash"/><line x1="749" x2="749" y1="155" y2="138" class="shape-dash"/><line x1="699" x2="699" y1="240" y2="300" marker-end="url(#cv-out)" class="arr-out"/><line x1="684" x2="660" y1="280" y2="294" marker-end="url(#cv-out)" class="arr-out"/><line x1="714" x2="738" y1="280" y2="294" marker-end="url(#cv-out)" class="arr-out"/><line x1="649" x2="615" y1="200" y2="200" marker-end="url(#cv-out)" class="arr-out"/><line x1="749" x2="783" y1="200" y2="200" marker-end="url(#cv-out)" class="arr-out"/><line x1="649" x2="615" y1="175" y2="175" marker-end="url(#cv-out)" class="arr-out"/><line x1="749" x2="783" y1="175" y2="175" marker-end="url(#cv-out)" class="arr-out"/><text x="699" y="330" class="panel-cap" text-anchor="middle">Free side:</text><text x="699" y="348" class="panel-hi" text-anchor="middle">outside (capsule up)</text><text x="699" y="365" class="note" text-anchor="middle">equator-and-above is infinite capsule</text><rect width="190" height="300" x="802" y="72" class="frame" rx="8"/><text x="897" y="94" class="panel-ttl" text-anchor="middle">Sphere</text><text x="897" y="110" class="panel-opt" text-anchor="middle">Invert + Hemisphere ✓</text><path d="M 847 240 L 847 155 L 847 138" class="shape-dash"/><path d="M 947 240 L 947 155 L 947 138" class="shape-dash"/><path d="M 847 240 A 50 50 0 0 0 947 240 L 947 155 L 847 155 Z" class="shape-f"/><line x1="847" x2="847" y1="240" y2="155" class="shape"/><line x1="947" x2="947" y1="240" y2="155" class="shape"/><line x1="847" x2="947" y1="155" y2="155" class="shape-dash"/><line x1="897" x2="897" y1="285" y2="240" marker-end="url(#cv-in)" class="arr-in"/><line x1="867" x2="882" y1="277" y2="252" marker-end="url(#cv-in)" class="arr-in"/><line x1="927" x2="912" y1="277" y2="252" marker-end="url(#cv-in)" class="arr-in"/><line x1="830" x2="847" y1="200" y2="200" marker-end="url(#cv-in)" class="arr-in"/><line x1="964" x2="947" y1="200" y2="200" marker-end="url(#cv-in)" class="arr-in"/><line x1="830" x2="847" y1="175" y2="175" marker-end="url(#cv-in)" class="arr-in"/><line x1="964" x2="947" y1="175" y2="175" marker-end="url(#cv-in)" class="arr-in"/><text x="897" y="330" class="panel-cap" text-anchor="middle">Free side:</text><text x="897" y="348" class="panel-hi2" text-anchor="middle">inside (bowl)</text><text x="897" y="365" class="note" text-anchor="middle">catches falling objects from above</text><text x="20" y="402" class="note">Shaded fill marks the &quot;solid&quot; side (geometry is pushed off it). Dashed outlines mean the surface continues to infinity.</text></svg>