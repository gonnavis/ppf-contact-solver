<svg xmlns="http://www.w3.org/2000/svg" aria-label="Docker over SSH transport topology: the add-on lives on the Blender workstation while the Docker daemon and container run on a remote Linux host reached over SSH" role="img" viewBox="0 0 860 360"><title>Docker over SSH transport topology</title><desc>A single block diagram showing that in Docker over SSH (and Docker over SSH Command) mode the add-on stays on the Blender workstation while the daemon and container live on a remote Linux host reached over SSH. Lifecycle commands ride docker exec on the SSH session and server traffic rides an SSH tunnel to the container&apos;s published port on the remote&apos;s localhost; the port publish on the container is what makes the tunnel actually reach ppf-cts-server.</desc><defs><marker id="ds-arrow-b" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2e6da4" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="ds-arrow-p" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6a3ea1" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><style>.hdr-title{font:700 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1a1a1a}.hdr-sub{font:italic 12px -apple-system,sans-serif;fill:#555}.hdr-addon,.hdr-host{fill:#e9eef7;stroke:#8fa7c7;stroke-width:1}.hdr-host{fill:#fff3e0;stroke:#d7a95a}.hdr-container{fill:#eef6eb;stroke:#86b36a;stroke-width:1}.mode-title{font:700 16px -apple-system,sans-serif;fill:#1a1a1a}.mode-sub{font:12px -apple-system,sans-serif;fill:#555}.arr-ctl,.arr-data{stroke:#2e6da4;stroke-width:2;fill:none}.arr-data{stroke:#6a3ea1;stroke-dasharray:5 4}.lbl{fill:#1a1a1a}.lbl,.lbl-ctl,.lbl-data{font:600 12px -apple-system,sans-serif}.lbl-ctl{fill:#1f4a75}.lbl-data{fill:#5a3492}.lbl-mono{font:600 11px &quot;Menlo&quot;,&quot;Consolas&quot;,monospace;fill:#1a1a1a}.note{font:12px -apple-system,sans-serif;fill:#555}.machine-box{fill:none;stroke:#aaa;stroke-width:1.2;stroke-dasharray:6 4}.machine-lbl{font:italic 11px -apple-system,sans-serif;fill:#777}.port-pill{fill:#fff3e0;stroke:#d7a95a;stroke-width:1}.port-tx{font:700 11px -apple-system,sans-serif;fill:#7a4a00}.legend-box{fill:#fafafa;stroke:#ddd;stroke-width:1}</style><rect width="360" height="46" x="480" y="14" class="legend-box" rx="6"/><line x1="495" x2="525" y1="32" y2="32" marker-end="url(#ds-arrow-b)" class="arr-ctl"/><text x="532" y="36" class="lbl-ctl">lifecycle</text><text x="532" y="50" class="note">start/stop/exec, port check</text><line x1="660" x2="690" y1="32" y2="32" marker-end="url(#ds-arrow-p)" class="arr-data"/><text x="697" y="36" class="lbl-data">server traffic</text><text x="697" y="50" class="note">SSH tunnel to ppf-cts-server</text><text x="20" y="30" class="mode-title">Docker over SSH</text><text x="20" y="50" class="mode-sub">Daemon and container run on a remote Linux host, reached over SSH.</text><rect width="260" height="190" x="20" y="80" class="machine-box" rx="8"/><text x="36" y="100" class="machine-lbl">Blender workstation</text><rect width="540" height="190" x="300" y="80" class="machine-box" rx="8"/><text x="316" y="100" class="machine-lbl">Remote Linux host (SSH reachable)</text><rect width="220" height="70" x="50" y="122" class="hdr-addon" rx="6"/><text x="160" y="150" class="hdr-title" text-anchor="middle">Blender + add-on</text><text x="160" y="170" class="hdr-sub" text-anchor="middle">paramiko (SSH)</text><rect width="220" height="70" x="320" y="122" class="hdr-host" rx="6"/><text x="430" y="150" class="hdr-title" text-anchor="middle">Docker daemon</text><text x="430" y="170" class="hdr-sub" text-anchor="middle">on the remote host</text><rect width="220" height="70" x="590" y="122" class="hdr-container" rx="6"/><text x="700" y="150" class="hdr-title" text-anchor="middle">container</text><text x="700" y="170" class="lbl-mono" text-anchor="middle">ppf-cts-server :PORT</text><rect width="210" height="22" x="595" y="202" class="port-pill" rx="11"/><text x="700" y="217" class="port-tx" text-anchor="middle">-p PORT:PORT must be published</text><line x1="270" x2="320" y1="144" y2="144" marker-end="url(#ds-arrow-b)" class="arr-ctl"/><line x1="540" x2="590" y1="144" y2="144" marker-end="url(#ds-arrow-b)" class="arr-ctl"/><text x="295" y="136" class="lbl-mono" text-anchor="middle">ssh</text><text x="565" y="136" class="lbl-mono" text-anchor="middle">exec</text><path marker-end="url(#ds-arrow-p)" d="M 270 180 Q 430 252 590 180" class="arr-data"/><text x="430" y="250" class="lbl-data" text-anchor="middle">SSH tunnel (direct-tcpip) to remote localhost:&lt;port&gt;</text><text x="430" y="266" class="note" text-anchor="middle">arrives at ppf-cts-server through the port the container publishes</text><text x="20" y="308" class="note"><tspan class="lbl">Docker over SSH Command</tspan> is identical at the transport level; only the SSH fields (host, port, user, key)</text><text x="20" y="326" class="note">are parsed from a pasted <tspan class="lbl-mono">ssh ...</tspan> string instead of entered as fields.</text><text x="20" y="350" class="note">The container must publish the server port; without <tspan class="lbl-mono">-p &lt;port&gt;:&lt;port&gt;</tspan> the SSH tunnel cannot reach <tspan class="lbl-mono">ppf-cts-server</tspan>.</text></svg>