<svg xmlns="http://www.w3.org/2000/svg" aria-label="SSH (Direct) transport topology: the add-on lives on the Blender workstation while ppf-cts-server runs directly on a remote Linux host reached over SSH" role="img" viewBox="0 0 860 320"><title>SSH (Direct) transport topology</title><desc>A single block diagram showing that in SSH (Direct) and SSH Command modes the add-on stays on the Blender workstation while ppf-cts-server runs directly on a remote Linux host reached over SSH. There is no Docker daemon and no container. Lifecycle commands (start, stop) ride a paramiko SSH session to the remote shell, and server traffic rides an SSH tunnel to the remote&apos;s localhost port that ppf-cts-server listens on.</desc><defs><marker id="ss-arrow-b" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2e6da4" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="ss-arrow-p" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6a3ea1" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><style>.hdr-title{font:700 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1a1a1a}.hdr-sub{font:italic 12px -apple-system,sans-serif;fill:#555}.hdr-addon{fill:#e9eef7;stroke:#8fa7c7;stroke-width:1}.hdr-container{fill:#eef6eb;stroke:#86b36a;stroke-width:1}.mode-title{font:700 16px -apple-system,sans-serif;fill:#1a1a1a}.mode-sub{font:12px -apple-system,sans-serif;fill:#555}.arr-ctl,.arr-data{stroke:#2e6da4;stroke-width:2;fill:none}.arr-data{stroke:#6a3ea1;stroke-dasharray:5 4}.lbl{fill:#1a1a1a}.lbl,.lbl-ctl,.lbl-data{font:600 12px -apple-system,sans-serif}.lbl-ctl{fill:#1f4a75}.lbl-data{fill:#5a3492}.lbl-mono{font:600 11px &quot;Menlo&quot;,&quot;Consolas&quot;,monospace;fill:#1a1a1a}.note{font:12px -apple-system,sans-serif;fill:#555}.machine-box{fill:none;stroke:#aaa;stroke-width:1.2;stroke-dasharray:6 4}.machine-lbl{font:italic 11px -apple-system,sans-serif;fill:#777}.legend-box{fill:#fafafa;stroke:#ddd;stroke-width:1}</style><rect width="360" height="46" x="480" y="14" class="legend-box" rx="6"/><line x1="495" x2="525" y1="32" y2="32" marker-end="url(#ss-arrow-b)" class="arr-ctl"/><text x="532" y="36" class="lbl-ctl">lifecycle</text><text x="532" y="50" class="note">start / stop server</text><line x1="660" x2="690" y1="32" y2="32" marker-end="url(#ss-arrow-p)" class="arr-data"/><text x="697" y="36" class="lbl-data">server traffic</text><text x="697" y="50" class="note">SSH tunnel to ppf-cts-server</text><text x="20" y="30" class="mode-title">SSH (Direct)</text><text x="20" y="50" class="mode-sub">ppf-cts-server runs directly on a remote Linux host, reached over SSH.</text><rect width="260" height="170" x="20" y="80" class="machine-box" rx="8"/><text x="36" y="100" class="machine-lbl">Blender workstation</text><rect width="540" height="170" x="300" y="80" class="machine-box" rx="8"/><text x="316" y="100" class="machine-lbl">Remote Linux host (SSH reachable)</text><rect width="220" height="70" x="50" y="122" class="hdr-addon" rx="6"/><text x="160" y="150" class="hdr-title" text-anchor="middle">Blender + add-on</text><text x="160" y="170" class="hdr-sub" text-anchor="middle">paramiko (SSH)</text><rect width="280" height="70" x="430" y="122" class="hdr-container" rx="6"/><text x="570" y="150" class="hdr-title" text-anchor="middle">ppf-cts-server</text><text x="570" y="170" class="lbl-mono" text-anchor="middle">ppf-cts-server --host 127.0.0.1</text><line x1="270" x2="430" y1="144" y2="144" marker-end="url(#ss-arrow-b)" class="arr-ctl"/><text x="350" y="136" class="lbl-mono" text-anchor="middle">ssh exec</text><path marker-end="url(#ss-arrow-p)" d="M 270 180 Q 360 232 430 180" class="arr-data"/><text x="350" y="230" class="lbl-data" text-anchor="middle">SSH tunnel (direct-tcpip) to remote localhost:9090</text><text x="350" y="246" class="note" text-anchor="middle">ppf-cts-server is bound loopback-only, so the SSH tunnel is the only way in</text><text x="20" y="288" class="note"><tspan class="lbl">SSH Command</tspan> mode is identical at the transport level; only the SSH fields (host, port, user,</text><text x="20" y="306" class="note">key) are parsed from a pasted <tspan class="lbl-mono">ssh ...</tspan> string instead of entered as fields.</text></svg>