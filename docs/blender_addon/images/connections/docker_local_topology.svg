<svg xmlns="http://www.w3.org/2000/svg" aria-label="Docker (local) transport topology: the Blender add-on, the Docker daemon, and the container running ppf-cts-server all live on the Blender workstation" role="img" viewBox="0 0 860 270"><title>Docker (local) transport topology</title><desc>A single block diagram showing that in Docker (local) mode the Blender add-on, the Docker daemon, and the container running ppf-cts-server all live on the Blender workstation. The add-on drives the daemon with docker-py and reaches ppf-cts-server with a plain TCP socket to localhost on the port the container publishes.</desc><defs><marker id="dl-arrow-b" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2e6da4" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="dl-arrow-p" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6a3ea1" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><style>.hdr-title{font:700 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1a1a1a}.hdr-sub{font:italic 12px -apple-system,sans-serif;fill:#555}.hdr-addon,.hdr-host{fill:#e9eef7;stroke:#8fa7c7;stroke-width:1}.hdr-host{fill:#fff3e0;stroke:#d7a95a}.hdr-container{fill:#eef6eb;stroke:#86b36a;stroke-width:1}.mode-title{font:700 16px -apple-system,sans-serif;fill:#1a1a1a}.mode-sub{font:12px -apple-system,sans-serif;fill:#555}.arr-ctl,.arr-data{stroke:#2e6da4;stroke-width:2;fill:none}.arr-data{stroke:#6a3ea1;stroke-dasharray:5 4}.lbl-ctl,.lbl-data{font:600 12px -apple-system,sans-serif;fill:#1f4a75}.lbl-data{fill:#5a3492}.lbl-mono{font:600 11px &quot;Menlo&quot;,&quot;Consolas&quot;,monospace;fill:#1a1a1a}.note{font:12px -apple-system,sans-serif;fill:#555}.machine-box{fill:none;stroke:#aaa;stroke-width:1.2;stroke-dasharray:6 4}.machine-lbl{font:italic 11px -apple-system,sans-serif;fill:#777}.legend-box{fill:#fafafa;stroke:#ddd;stroke-width:1}</style><rect width="360" height="46" x="480" y="14" class="legend-box" rx="6"/><line x1="495" x2="525" y1="32" y2="32" marker-end="url(#dl-arrow-b)" class="arr-ctl"/><text x="532" y="36" class="lbl-ctl">lifecycle</text><text x="532" y="50" class="note">start/stop/exec</text><line x1="660" x2="690" y1="32" y2="32" marker-end="url(#dl-arrow-p)" class="arr-data"/><text x="697" y="36" class="lbl-data">server traffic</text><text x="697" y="50" class="note">TCP to ppf-cts-server</text><text x="20" y="30" class="mode-title">Docker (local)</text><text x="20" y="50" class="mode-sub">Daemon and container both run on the Blender machine.</text><rect width="820" height="170" x="20" y="70" class="machine-box" rx="8"/><text x="36" y="90" class="machine-lbl">Blender workstation</text><rect width="220" height="70" x="50" y="110" class="hdr-addon" rx="6"/><text x="160" y="138" class="hdr-title" text-anchor="middle">Blender + add-on</text><text x="160" y="158" class="hdr-sub" text-anchor="middle">docker-py + socket</text><rect width="220" height="70" x="320" y="110" class="hdr-host" rx="6"/><text x="430" y="138" class="hdr-title" text-anchor="middle">Docker daemon</text><text x="430" y="158" class="hdr-sub" text-anchor="middle">local Unix socket</text><rect width="220" height="70" x="590" y="110" class="hdr-container" rx="6"/><text x="700" y="138" class="hdr-title" text-anchor="middle">container</text><text x="700" y="158" class="lbl-mono" text-anchor="middle">ppf-cts-server :PORT</text><line x1="270" x2="320" y1="132" y2="132" marker-end="url(#dl-arrow-b)" class="arr-ctl"/><line x1="540" x2="590" y1="132" y2="132" marker-end="url(#dl-arrow-b)" class="arr-ctl"/><text x="295" y="124" class="lbl-mono" text-anchor="middle">docker-py</text><text x="565" y="124" class="lbl-mono" text-anchor="middle">exec</text><path marker-end="url(#dl-arrow-p)" d="M 270 168 Q 430 216 590 168" class="arr-data"/><text x="430" y="213" class="lbl-data" text-anchor="middle">socket to localhost:&lt;port&gt;</text><text x="430" y="229" class="note" text-anchor="middle">reaches ppf-cts-server via the port the container publishes</text></svg>