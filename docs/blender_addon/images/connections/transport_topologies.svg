<svg xmlns="http://www.w3.org/2000/svg" aria-label="Transport topologies: where the Blender add-on and ppf-cts-server live for each of the five connection types, and how the add-on reaches the solver in each one" role="img" viewBox="0 0 900 820"><title>Transport topologies across the five connection types</title><desc>Five stacked block diagrams, one per connection type, showing which machine the Blender add-on and ppf-cts-server each live on. Top row, Linux Native / macOS Native keeps both on the Blender workstation and talks over a loopback TCP socket with no transport boundary. Second row, SSH and SSH Command, keeps the add-on on the workstation and reaches ppf-cts-server on a remote Linux host through a paramiko SSH session, with server traffic riding an SSH tunnel. Third row, Docker on the local machine, keeps the add-on, Docker daemon, and container all on the Blender workstation. Fourth row, Docker over SSH and over SSH Command, keeps the add-on on the workstation and reaches the daemon and container on a remote Linux host through a single SSH session. Bottom row, Windows Native, launches ppf-cts-server.exe as a hidden subprocess on the same Windows workstation as the add-on. Blue solid arrows carry lifecycle commands (start, stop, exec, port checks) and purple dashed arrows carry TCP traffic to ppf-cts-server.</desc><defs><marker id="f-arrow-b" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2e6da4" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="f-arrow-p" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6a3ea1" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><style>.hdr-title{font:700 14px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1a1a1a}.hdr-sub{font:italic 11px -apple-system,sans-serif;fill:#555}.hdr-addon,.hdr-host{fill:#e9eef7;stroke:#8fa7c7;stroke-width:1}.hdr-host{fill:#fff3e0;stroke:#d7a95a}.hdr-container{fill:#eef6eb;stroke:#86b36a;stroke-width:1}.mode-title{font:700 15px -apple-system,sans-serif;fill:#1a1a1a}.mode-sub{font:12px -apple-system,sans-serif;fill:#555}.arr-ctl,.arr-data{stroke:#2e6da4;stroke-width:2;fill:none}.arr-data{stroke:#6a3ea1;stroke-dasharray:5 4}.lbl-ctl,.lbl-data{font:600 12px -apple-system,sans-serif;fill:#1f4a75}.lbl-data{fill:#5a3492}.lbl-mono{font:600 11px &quot;Menlo&quot;,&quot;Consolas&quot;,monospace;fill:#1a1a1a}.note{font:11px -apple-system,sans-serif;fill:#555}.machine-box{fill:none;stroke:#aaa;stroke-width:1.2;stroke-dasharray:6 4}.machine-lbl{font:italic 11px -apple-system,sans-serif;fill:#777}.legend-box{fill:#fafafa;stroke:#ddd;stroke-width:1}</style><rect width="370" height="46" x="520" y="12" class="legend-box" rx="6"/><line x1="535" x2="565" y1="30" y2="30" marker-end="url(#f-arrow-b)" class="arr-ctl"/><text x="572" y="34" class="lbl-ctl">lifecycle</text><text x="572" y="48" class="note">start / stop / exec / port check</text><line x1="695" x2="725" y1="30" y2="30" marker-end="url(#f-arrow-p)" class="arr-data"/><text x="732" y="34" class="lbl-data">server traffic</text><text x="732" y="48" class="note">TCP to ppf-cts-server</text><text x="20" y="90" class="mode-title">Linux Native / macOS Native</text><text x="20" y="108" class="mode-sub">Add-on and <tspan class="lbl-mono">ppf-cts-server</tspan> share one workstation. Loopback TCP, no transport boundary.</text><rect width="860" height="72" x="20" y="120" class="machine-box" rx="8"/><text x="36" y="138" class="machine-lbl">Blender workstation (Linux / macOS)</text><rect width="230" height="40" x="60" y="146" class="hdr-addon" rx="6"/><text x="175" y="163" class="hdr-title" text-anchor="middle">Blender + add-on</text><text x="175" y="179" class="hdr-sub" text-anchor="middle">child process + socket</text><rect width="230" height="40" x="620" y="146" class="hdr-container" rx="6"/><text x="735" y="163" class="hdr-title" text-anchor="middle">ppf-cts-server</text><text x="735" y="179" class="lbl-mono" text-anchor="middle">ppf-cts-server :PORT</text><line x1="290" x2="620" y1="158" y2="158" marker-end="url(#f-arrow-b)" class="arr-ctl"/><line x1="290" x2="620" y1="174" y2="174" marker-end="url(#f-arrow-p)" class="arr-data"/><text x="455" y="154" class="lbl-mono" text-anchor="middle">spawn ppf-cts-server</text><text x="455" y="188" class="lbl-mono" text-anchor="middle">socket to localhost:&lt;port&gt;</text><text x="20" y="225" class="mode-title">SSH / SSH Command</text><text x="20" y="243" class="mode-sub">Add-on on the workstation, <tspan class="lbl-mono">ppf-cts-server</tspan> on a remote Linux host. One paramiko SSH session carries both.</text><rect width="270" height="80" x="20" y="255" class="machine-box" rx="8"/><text x="36" y="273" class="machine-lbl">Blender workstation</text><rect width="570" height="80" x="310" y="255" class="machine-box" rx="8"/><text x="326" y="273" class="machine-lbl">Remote Linux host</text><rect width="220" height="40" x="45" y="283" class="hdr-addon" rx="6"/><text x="155" y="300" class="hdr-title" text-anchor="middle">Blender + add-on</text><text x="155" y="316" class="hdr-sub" text-anchor="middle">paramiko (SSH)</text><rect width="320" height="40" x="540" y="283" class="hdr-container" rx="6"/><text x="700" y="300" class="hdr-title" text-anchor="middle">ppf-cts-server</text><text x="700" y="316" class="lbl-mono" text-anchor="middle">nohup ./ppf-cts-server :PORT</text><line x1="265" x2="540" y1="295" y2="295" marker-end="url(#f-arrow-b)" class="arr-ctl"/><line x1="265" x2="540" y1="311" y2="311" marker-end="url(#f-arrow-p)" class="arr-data"/><text x="402" y="291" class="lbl-mono" text-anchor="middle">ssh exec</text><text x="402" y="325" class="lbl-mono" text-anchor="middle">SSH tunnel (direct-tcpip)</text><text x="20" y="372" class="mode-title">Docker (local)</text><text x="20" y="390" class="mode-sub">Daemon and container both on the Blender workstation. Detailed in <tspan class="lbl-mono">connections/docker</tspan>.</text><rect width="860" height="100" x="20" y="402" class="machine-box" rx="8"/><text x="36" y="420" class="machine-lbl">Blender workstation (Linux)</text><rect width="220" height="40" x="45" y="430" class="hdr-addon" rx="6"/><text x="155" y="447" class="hdr-title" text-anchor="middle">Blender + add-on</text><text x="155" y="463" class="hdr-sub" text-anchor="middle">docker-py + socket</text><rect width="220" height="40" x="335" y="430" class="hdr-host" rx="6"/><text x="445" y="447" class="hdr-title" text-anchor="middle">Docker daemon</text><text x="445" y="463" class="hdr-sub" text-anchor="middle">local Unix socket</text><rect width="220" height="40" x="625" y="430" class="hdr-container" rx="6"/><text x="735" y="447" class="hdr-title" text-anchor="middle">container</text><text x="735" y="463" class="lbl-mono" text-anchor="middle">ppf-cts-server :PORT</text><line x1="265" x2="335" y1="442" y2="442" marker-end="url(#f-arrow-b)" class="arr-ctl"/><line x1="555" x2="625" y1="442" y2="442" marker-end="url(#f-arrow-b)" class="arr-ctl"/><text x="300" y="436" class="lbl-mono" text-anchor="middle">docker-py</text><text x="590" y="436" class="lbl-mono" text-anchor="middle">exec</text><path marker-end="url(#f-arrow-p)" d="M 265 470 Q 445 500 625 470" class="arr-data"/><text x="445" y="497" class="note" text-anchor="middle">socket to localhost:&lt;port&gt; (bypasses daemon)</text><text x="20" y="540" class="mode-title">Docker over SSH / over SSH Command</text><text x="20" y="558" class="mode-sub">Daemon and container on a remote Linux host. Detailed in <tspan class="lbl-mono">connections/docker</tspan>.</text><rect width="230" height="100" x="20" y="570" class="machine-box" rx="8"/><text x="36" y="588" class="machine-lbl">Blender workstation</text><rect width="610" height="100" x="270" y="570" class="machine-box" rx="8"/><text x="286" y="588" class="machine-lbl">Remote Linux host (SSH reachable)</text><rect width="200" height="40" x="35" y="598" class="hdr-addon" rx="6"/><text x="135" y="615" class="hdr-title" text-anchor="middle">Blender + add-on</text><text x="135" y="631" class="hdr-sub" text-anchor="middle">paramiko (SSH)</text><rect width="240" height="40" x="300" y="598" class="hdr-host" rx="6"/><text x="420" y="615" class="hdr-title" text-anchor="middle">Docker daemon</text><text x="420" y="631" class="hdr-sub" text-anchor="middle">on the remote host</text><rect width="240" height="40" x="610" y="598" class="hdr-container" rx="6"/><text x="730" y="615" class="hdr-title" text-anchor="middle">container</text><text x="730" y="631" class="lbl-mono" text-anchor="middle">ppf-cts-server :PORT (-p &lt;port&gt;:&lt;port&gt;)</text><line x1="235" x2="300" y1="610" y2="610" marker-end="url(#f-arrow-b)" class="arr-ctl"/><line x1="540" x2="610" y1="610" y2="610" marker-end="url(#f-arrow-b)" class="arr-ctl"/><text x="267" y="604" class="lbl-mono" text-anchor="middle">ssh</text><text x="575" y="604" class="lbl-mono" text-anchor="middle">exec</text><path marker-end="url(#f-arrow-p)" d="M 235 638 Q 420 668 610 638" class="arr-data"/><text x="420" y="665" class="note" text-anchor="middle">SSH tunnel to remote localhost:&lt;port&gt;</text><text x="20" y="708" class="mode-title">Windows Native</text><text x="20" y="726" class="mode-sub">Add-on launches <tspan class="lbl-mono">ppf-cts-server.exe</tspan> as a hidden subprocess on the same Windows workstation. No SSH, no Docker.</text><rect width="860" height="72" x="20" y="738" class="machine-box" rx="8"/><text x="36" y="756" class="machine-lbl">Blender workstation (Windows)</text><rect width="230" height="40" x="60" y="764" class="hdr-addon" rx="6"/><text x="175" y="781" class="hdr-title" text-anchor="middle">Blender + add-on</text><text x="175" y="797" class="hdr-sub" text-anchor="middle">Win32 subprocess + socket</text><rect width="230" height="40" x="620" y="764" class="hdr-container" rx="6"/><text x="735" y="781" class="hdr-title" text-anchor="middle">ppf-cts-server.exe</text><text x="735" y="797" class="lbl-mono" text-anchor="middle">ppf-cts-server.exe :PORT</text><line x1="290" x2="620" y1="776" y2="776" marker-end="url(#f-arrow-b)" class="arr-ctl"/><line x1="290" x2="620" y1="792" y2="792" marker-end="url(#f-arrow-p)" class="arr-data"/><text x="455" y="772" class="lbl-mono" text-anchor="middle">CreateProcess (no console)</text><text x="455" y="806" class="lbl-mono" text-anchor="middle">socket to localhost:&lt;port&gt;</text></svg>