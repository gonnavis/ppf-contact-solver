<svg xmlns="http://www.w3.org/2000/svg" aria-label="Windows Native transport topology: the Blender add-on launches ppf-cts-server.exe as a hidden subprocess on the same Windows workstation" role="img" viewBox="0 0 860 270"><title>Windows Native transport topology</title><desc>A single block diagram showing that in Windows Native mode the Blender add-on launches ppf-cts-server.exe as a hidden subprocess on the same Windows workstation. There is no SSH and no Docker; the add-on launches the binary directly and talks to it over a loopback TCP socket.</desc><defs><marker id="wn-arrow-b" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2e6da4" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="wn-arrow-p" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6a3ea1" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><style>.hdr-title{font:700 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1a1a1a}.hdr-sub{font:italic 12px -apple-system,sans-serif;fill:#555}.hdr-addon{fill:#e9eef7;stroke:#8fa7c7;stroke-width:1}.hdr-container{fill:#eef6eb;stroke:#86b36a;stroke-width:1}.mode-title{font:700 16px -apple-system,sans-serif;fill:#1a1a1a}.mode-sub{font:12px -apple-system,sans-serif;fill:#555}.arr-ctl,.arr-data{stroke:#2e6da4;stroke-width:2;fill:none}.arr-data{stroke:#6a3ea1;stroke-dasharray:5 4}.lbl-ctl,.lbl-data{font:600 12px -apple-system,sans-serif;fill:#1f4a75}.lbl-data{fill:#5a3492}.lbl-mono{font:600 11px &quot;Menlo&quot;,&quot;Consolas&quot;,monospace;fill:#1a1a1a}.note{font:12px -apple-system,sans-serif;fill:#555}.machine-box{fill:none;stroke:#aaa;stroke-width:1.2;stroke-dasharray:6 4}.machine-lbl{font:italic 11px -apple-system,sans-serif;fill:#777}.legend-box{fill:#fafafa;stroke:#ddd;stroke-width:1}</style><rect width="360" height="46" x="480" y="14" class="legend-box" rx="6"/><line x1="495" x2="525" y1="32" y2="32" marker-end="url(#wn-arrow-b)" class="arr-ctl"/><text x="532" y="36" class="lbl-ctl">lifecycle</text><text x="532" y="50" class="note">subprocess start / stop</text><line x1="660" x2="690" y1="32" y2="32" marker-end="url(#wn-arrow-p)" class="arr-data"/><text x="697" y="36" class="lbl-data">server traffic</text><text x="697" y="50" class="note">TCP to ppf-cts-server.exe</text><text x="20" y="30" class="mode-title">Windows Native</text><text x="20" y="50" class="mode-sub">Add-on launches ppf-cts-server.exe as a hidden subprocess on the same Windows machine.</text><rect width="820" height="170" x="20" y="70" class="machine-box" rx="8"/><text x="36" y="90" class="machine-lbl">Blender workstation (Windows)</text><rect width="240" height="70" x="60" y="110" class="hdr-addon" rx="6"/><text x="180" y="138" class="hdr-title" text-anchor="middle">Blender + add-on</text><text x="180" y="158" class="hdr-sub" text-anchor="middle">Win32 subprocess + socket</text><rect width="240" height="70" x="560" y="110" class="hdr-container" rx="6"/><text x="680" y="138" class="hdr-title" text-anchor="middle">ppf-cts-server.exe</text><text x="680" y="158" class="lbl-mono" text-anchor="middle">ppf-cts-server.exe :9090</text><line x1="300" x2="560" y1="132" y2="132" marker-end="url(#wn-arrow-b)" class="arr-ctl"/><text x="430" y="124" class="lbl-mono" text-anchor="middle">CreateProcess (no console window)</text><path marker-end="url(#wn-arrow-p)" d="M 300 168 Q 430 220 560 168" class="arr-data"/><text x="430" y="217" class="lbl-data" text-anchor="middle">socket to localhost:9090</text><text x="430" y="233" class="note" text-anchor="middle">no SSH, no Docker: everything stays on this machine</text></svg>